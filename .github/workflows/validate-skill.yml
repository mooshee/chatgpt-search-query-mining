name: Validate public skill

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate skill package layout
        shell: bash
        run: |
          test ! -f SKILL.md
          test -f skills/chatgpt-query-research/SKILL.md
          test -f skills/chatgpt-query-research/agents/openai.yaml
          test -x bin/query-miner
          bash -n bin/query-miner
          grep -q '^name: chatgpt-query-research$' skills/chatgpt-query-research/SKILL.md
          grep -q '\$chatgpt-query-research' skills/chatgpt-query-research/agents/openai.yaml

      - name: Compile and test the native Rust parser
        shell: bash
        run: |
          cargo test --all-targets
          cat > /tmp/chatgpt-query-sample.json <<'JSON'
          {
            "queries": [
              "alpha question",
              "alpha question",
              {"query": "beta question"},
              "https://example.com/not-a-query"
            ]
          }
          JSON
          ./bin/query-miner /tmp/chatgpt-query-sample.json --format markdown > /tmp/queries.md
          grep -qx -- '- alpha question' /tmp/queries.md
          grep -qx -- '- beta question' /tmp/queries.md
